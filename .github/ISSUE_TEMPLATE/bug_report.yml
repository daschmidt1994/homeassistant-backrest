name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.1"
    validations:
      required: true
  - type: input
    id: backrest_version
    attributes:
      label: Backrest version
      placeholder: "1.14.1"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or debug log
      description: >-
        Download diagnostics from the integration page or enable debug logging for
        custom_components.backrest. Check that no private data is included before posting.
      render: text
